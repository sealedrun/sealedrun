[project]
name = "sealedrun-recorder"
version = "0.1.1"
description = "SealedRun recorder service: API and UI host for evidence bundles"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "sealedrun",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.53.0",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.32",
  "psycopg[binary]>=3.3.6",
]

[project.scripts]
sealedrun-recorder = "sealedrun_recorder.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sealedrun_recorder"]
