services:
  sealedrun:
    image: ghcr.io/sealedrun/sealedrun:latest
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sealedrun-data:/data
      - ./upstreams.yaml:/data/upstreams.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEALEDRUN_DATABASE_URL: ${SEALEDRUN_DATABASE_URL:-}
      SEALEDRUN_API_TOKEN: ${SEALEDRUN_API_TOKEN:-}
      SEALEDRUN_TRUSTED_PRINCIPALS: ${SEALEDRUN_TRUSTED_PRINCIPALS:-[]}
      SEALEDRUN_ALLOWED_HOSTS: ${SEALEDRUN_ALLOWED_HOSTS:-["127.0.0.1","localhost"]}
      SEALEDRUN_POLICY_BLOCK_TO_CLOUD: ${SEALEDRUN_POLICY_BLOCK_TO_CLOUD:-[]}
      SEALEDRUN_ANCHOR_TSA_URL: ${SEALEDRUN_ANCHOR_TSA_URL:-}
      SEALEDRUN_ANCHOR_TSA_FALLBACK_URL: ${SEALEDRUN_ANCHOR_TSA_FALLBACK_URL:-}
      SEALEDRUN_ANCHOR_REKOR_URL: ${SEALEDRUN_ANCHOR_REKOR_URL:-}
      SEALEDRUN_ANCHOR_INTERVAL_SECONDS: ${SEALEDRUN_ANCHOR_INTERVAL_SECONDS:-600}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: sealedrun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-} # no default: postgres refuses to start when empty
      POSTGRES_DB: sealedrun
    volumes:
      - sealedrun-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sealedrun"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sealedrun-data:
  sealedrun-postgres:
