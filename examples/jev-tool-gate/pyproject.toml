[project]
name = "sealedrun-example-jev-tool-gate"
version = "0.0.0"
description = "A shell tool gated by a decision model (Jev via OpenRouter), recorded by SealedRun"
requires-python = ">=3.12"
dependencies = ["sealedrun>=0.6.0"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.uv.sources]
sealedrun = { path = "../../packages/sealedrun-py", editable = true }
