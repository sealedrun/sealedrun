[project]
name = "sealedrun-example-langgraph-mcp"
version = "0.0.0"
description = "A LangGraph agent with a filesystem MCP tool, recorded by SealedRun"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.4",
  "langgraph>=1.2",
  "langchain-mcp-adapters>=0.3.2",
  "langchain-ollama>=1.0",
  "langchain-openai>=1.0",
  "sealedrun>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
