name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Tag must match every package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$(uv version --package sealedrun --short)" = "$tag"
          test "$(uv version --package sealedrun-recorder --short)" = "$tag"
          test "$(node -p "require('./packages/sealedrun-ts/package.json').version")" = "$tag"
      - name: Build Python packages
        run: |
          uv build --package sealedrun --out-dir dist/sealedrun
          uv build --package sealedrun-recorder --out-dir dist/sealedrun-recorder
          uvx twine check --strict dist/sealedrun/* dist/sealedrun-recorder/*
      - name: Build npm package
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @sealedrun/core build
          cd packages/sealedrun-ts && pnpm pack --pack-destination ../../dist/npm
      - name: Installed wheels verify the example bundle
        run: |
          uv run --isolated --no-project --python 3.12 \
            --with dist/sealedrun/*.whl --with dist/sealedrun-recorder/*.whl \
            python -c "
          import sealedrun_recorder.main
          from sealedrun import read_bundle, verify_bundle
          with open('spec/examples/bundle.zip', 'rb') as fh:
              print(verify_bundle(read_bundle(fh)).bundle_id)
          "
      - name: Installed npm tarball verifies the example bundle
        run: |
          bundle="$PWD/spec/examples/bundle.zip"
          tarball="$(ls "$PWD"/dist/npm/*.tgz)"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          echo '{"type":"module","private":true}' > package.json
          npm install "$tarball"
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          import { readBundle, verifyBundle } from '@sealedrun/core';
          const bundle = await readBundle(new Uint8Array(readFileSync('$bundle')));
          console.log((await verifyBundle(bundle)).bundleId);
          "
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    strategy:
      matrix:
        package: [sealedrun, sealedrun-recorder]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/${{ matrix.package }}/

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: npm install -g npm@latest
      - run: npm publish dist/npm/*.tgz --access public
