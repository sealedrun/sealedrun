[project]
name = "sealedrun"
version = "0.1.1"
description = "SealedRun Record: canonicalization, hash chain, hybrid signatures and evidence bundles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Anatoli", email = "info@sealedrun.com" }]
dependencies = [
  "cryptography>=48",
  "rfc8785>=0.1",
  "jsonschema>=4.23",
  "referencing>=0.37.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security :: Cryptography",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sealedrun"]

[tool.hatch.build.targets.wheel.force-include]
"../../spec/schema" = "sealedrun/_schema"

[tool.hatch.build.targets.sdist.force-include]
"../../spec/schema" = "src/sealedrun/_schema"
